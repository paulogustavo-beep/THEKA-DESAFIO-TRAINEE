
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Theka</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
    <main class="auth-layout auth-layout--recuperacao">

        <section
            class="auth-brand auth-brand--espelhada"
            aria-label="Theka, biblioteca virtual"
        >
            <img
                class="auth-art"
                src="../assets/images/theka-ilustracao-acesso.svg"
                alt=""
            >

            <img
                class="auth-logo"
                src="../assets/images/theka-logo.svg"
                alt="Theka"
            >
        </section>

        <section
            class="auth-panel"
            aria-labelledby="titulo-pagina"
        >
            <div class="auth-content">

                <h1 class="auth-title" id="titulo-pagina">
                    Recuperar senha
                </h1>

                <form
                    class="auth-form"
                    data-formulario="recuperacao"
                >
                    <div class="auth-field">
                        <label class="auth-label" for="email">
                            E-mail
                        </label>

                        <input
                            class="auth-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="auth-actions">
                        <a
                            class="auth-button auth-button--outline"
                            href="login.html"
                        >
                            Voltar
                        </a>

                        <button
                            class="auth-button auth-button--primary"
                            type="submit"
                        >
                            Enviar
                        </button>
                    </div>

                    <p
                        id="mensagem-formulario"
                        class="auth-status"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></p>
                </form>

            </div>
        </section>

    </main>

    <script src="../scripts/login.js"></script>
</body>
</html>
