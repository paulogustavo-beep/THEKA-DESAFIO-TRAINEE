
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar senha | Theka</title>

    <style>
        :root {
            --marrom: #8c490d;
            --laranja: #f78520;
            --texto: #392414;
            --creme: #fff8f0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: var(--texto);
            background: var(--creme);
        }

        .pagina {
            display: grid;
            grid-template-columns: 58.5% 41.5%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        .painel-marca {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
            color: white;
            background: var(--marrom);
            text-align: center;
        }

        .marca {
            margin: 0;
            font-size: clamp(60px, 8vw, 110px);
            font-weight: 800;
            color: var(--laranja);
        }

        .descricao-marca {
            max-width: 300px;
            line-height: 1.6;
        }

        .painel-formulario {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            background: white;
        }

        .conteudo {
            width: min(100%, 420px);
        }

        h1 {
            margin: 0 0 14px;
            color: var(--marrom);
            font-size: 34px;
        }

        .explicacao {
            margin: 0 0 35px;
            line-height: 1.6;
            color: #725a49;
        }

        label {
            display: block;
            margin-bottom: 9px;
            font-weight: bold;
        }

        input {
            display: block;
            width: 100%;
            height: 46px;
            padding: 0 14px;
            border: 1px solid #d6bda8;
            border-radius: 8px;
            font: inherit;
        }

        input:focus-visible,
        button:focus-visible,
        a:focus-visible {
            outline: 3px solid #f7852080;
            outline-offset: 2px;
        }

        button {
            display: block;
            width: 100%;
            min-height: 46px;
            margin-top: 22px;
            padding: 12px;
            border: 0;
            border-radius: 8px;
            background: var(--laranja);
            color: #392414;
            font: inherit;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #e47410;
        }

        .aviso {
            margin: 16px 0 0;
            padding: 12px;
            border-radius: 8px;
            background: #fff0dc;
            line-height: 1.5;
        }

        .voltar {
            display: inline-block;
            margin-top: 24px;
            color: var(--marrom);
            font-weight: bold;
            text-decoration: none;
        }

        .voltar:hover {
            text-decoration: underline;
        }

        @media (max-width: 800px) {
            .pagina {
                grid-template-columns: 1fr;
            }

            .painel-marca {
                min-height: 210px;
                padding: 24px;
            }

            .marca {
                font-size: 64px;
            }

            .painel-formulario {
                padding: 38px 22px 65px;
            }

            h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>
    <main class="pagina">
        <section class="painel-marca" aria-label="Identidade Theka">
            <p class="marca">Theka</p>
            <p class="descricao-marca">
                Um lugar para descobrir novas histórias.
            </p>
        </section>

        <section class="painel-formulario" aria-labelledby="titulo">
            <div class="conteudo">
                <h1 id="titulo">Recuperar senha</h1>

                <p class="explicacao">
                    Informe seu e-mail para verificar o preenchimento.
                </p>

                <form id="form-recuperacao">
                    <label for="email">E-mail</label>

                    <input
                        id="email"
                        name="email"
                        type="email"
                        placeholder="seuemail@email.com"
                        autocomplete="email"
                        required
                    >

                    <button type="submit">
                        Verificar e-mail
                    </button>
                </form>

                <p
                    id="aviso"
                    class="aviso"
                    role="status"
                    aria-live="polite"
                    hidden
                ></p>

                <a class="voltar" href="login.html">
                    Voltar ao login
                </a>
            </div>
        </section>
    </main>

    <script>
        const formulario = document.querySelector('#form-recuperacao');
        const campoEmail = document.querySelector('#email');
        const aviso = document.querySelector('#aviso');

        formulario.addEventListener('submit', function (evento) {
            evento.preventDefault();

            campoEmail.value = campoEmail.value.trim();

            if (!formulario.reportValidity()) {
                return;
            }

            aviso.textContent = 'O formato do e-mail está correto.';
            aviso.hidden = false;
        });
    </script>
</body>
</html>
