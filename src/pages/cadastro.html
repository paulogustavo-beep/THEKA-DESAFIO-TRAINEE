
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Theka</title>

    <style>
        /* CORES DO THEKA */
        :root {
            --marrom: #8c490d;
            --laranja: #f78520;
            --laranja-escuro: #d96812;
            --branco: #ffffff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: var(--marrom);
        }

        /* ESTRUTURA PRINCIPAL */

        .auth-page {
            display: grid;
            grid-template-columns: 58.5% 41.5%;
            min-height: 100vh;
            min-height: 100dvh;
        }

        /* ÁREA DA LOGO */

        .brand-panel {
            position: relative;
            overflow: hidden;
            background: var(--marrom);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brand-content {
            text-align: center;
            padding: 30px;
        }

        .brand-name {
            font-size: clamp(70px, 12vw, 150px);
            font-weight: 900;
            letter-spacing: -8px;
            color: var(--laranja);
            margin: 0;
        }

        .brand-subtitle {
            color: #ffc18a;
            font-size: 19px;
            margin-top: 8px;
        }

        .decoration {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .decoration-one {
            width: 280px;
            height: 280px;
            border: 60px solid #f78520;
            opacity: 0.2;
            left: -140px;
            top: -100px;
        }

        .decoration-two {
            width: 220px;
            height: 220px;
            border: 48px solid #c06616;
            opacity: 0.6;
            right: -90px;
            bottom: -80px;
        }

        /* PAINEL DO CADASTRO */

        .form-panel {
            display: flex;
            align-items: center;
            background: var(--branco);
            border-radius: 24px 0 0 24px;
        }

        .form-content {
            width: 74%;
            max-width: 410px;
            margin-left: 9.5%;
            padding: 30px 0;
        }

        h1 {
            color: var(--laranja);
            font-size: clamp(33px, 3.6vw, 50px);
            letter-spacing: -0.035em;
            margin: 0 0 67px;
        }

        /* CAMPOS */

        .field + .field {
            margin-top: 19px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--laranja);
            font-size: clamp(14px, 1.16vw, 17px);
            font-weight: bold;
        }

        input {
            width: 100%;
            height: 37px;
            padding: 0 13px;
            border: 2px solid var(--laranja);
            border-radius: 999px;
            background: white;
            font: inherit;
            font-size: 13px;
            outline: none;
        }

        input::placeholder {
            color: #de9f70;
        }

        input:focus {
            border-color: var(--laranja-escuro);
            box-shadow: 0 0 0 3px #f7852038;
        }

        /* SENHA */

        .password-control {
            position: relative;
        }

        .password-control input {
            padding-right: 45px;
        }

        .password-toggle {
            position: absolute;
            right: 11px;
            top: 50%;
            transform: translateY(-50%);
            width: 28px;
            height: 28px;
            display: grid;
            place-items: center;
            background: transparent;
            color: var(--laranja);
            border: 0;
            cursor: pointer;
        }

        .password-toggle svg {
            width: 22px;
            height: 22px;
        }

        /* BOTÕES */

        .form-actions {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 13px;
            margin-top: 24px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 13px;
            font-weight: bold;
            min-height: 36px;
            padding: 7px 16px;
            border: 2px solid var(--laranja);
            border-radius: 999px;
            cursor: pointer;
        }

        .btn-outline {
            color: var(--laranja);
            background: white;
        }

        .btn-primary {
            color: white;
            background: var(--laranja);
        }

        .btn-outline:hover {
            background: #fff3e8;
        }

        .btn-primary:hover {
            background: var(--laranja-escuro);
        }

        /* MENSAGENS */

        .status {
            margin-top: 15px;
            font-size: 13px;
            line-height: 1.4;
            color: #914700;
        }

        .status.error {
            color: #a12d19;
        }

        .status[hidden] {
            display: none;
        }

        /* RESPONSIVIDADE */

        @media (max-width: 800px) {

            .auth-page {
                display: flex;
                flex-direction: column;
            }

            .brand-panel {
                height: 32vh;
                min-height: 190px;
                max-height: 330px;
            }

            .brand-name {
                font-size: 70px;
                letter-spacing: -4px;
            }

            .brand-subtitle {
                font-size: 14px;
            }

            .form-panel {
                flex: 1;
                display: block;
                margin-top: -16px;
                border-radius: 24px 24px 0 0;
                position: relative;
            }

            .form-content {
                width: 100%;
                max-width: 510px;
                margin: 0 auto;
                padding: 32px 22px 55px;
            }

            h1 {
                font-size: 32px;
                margin-bottom: 38px;
            }

            label {
                font-size: 16px;
            }

            .field + .field {
                margin-top: 18px;
            }

            input {
                height: 42px;
                font-size: 14px;
            }

            .form-actions {
                justify-content: center;
                margin-top: 29px;
            }
        }

        @media (max-width: 360px) {

            .brand-panel {
                min-height: 170px;
            }

            .form-content {
                padding: 25px 17px 45px;
            }

            h1 {
                font-size: 28px;
                margin-bottom: 26px;
            }

            .field + .field {
                margin-top: 13px;
            }
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <!-- IDENTIDADE VISUAL -->

        <section class="brand-panel">

            <div class="decoration decoration-one"></div>
            <div class="decoration decoration-two"></div>

            <div class="brand-content">
                <h2 class="brand-name">Theka</h2>
                <p class="brand-subtitle">
                    Sua biblioteca digital
                </p>
            </div>

        </section>

        <!-- FORMULÁRIO DE CADASTRO -->

        <section class="form-panel">

            <div class="form-content">

                <h1>Cadastro</h1>

                <form id="cadastro-form">

                    <!-- NOME -->

                    <div class="field">

                        <label for="nome">
                            Nome completo
                        </label>

                        <input
                            id="nome"
                            name="nome"
                            type="text"
                            placeholder="Seu nome completo"
                            autocomplete="name"
                            required
                        >

                    </div>

                    <!-- EMAIL -->

                    <div class="field">

                        <label for="email">
                            E-mail
                        </label>

                        <input
                            id="email"
                            name="email"
                            type="email"
                            placeholder="seuemail@email.com"
                            autocomplete="email"
                            required
                        >

                    </div>

                    <!-- SENHA -->

                    <div class="field">

                        <label for="senha">
                            Senha
                        </label>

                        <div class="password-control">

                            <input
                                id="senha"
                                name="senha"
                                type="password"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="senha"
                                aria-label="Mostrar senha"
                            >

                                <svg viewBox="0 0 24 24" fill="none">

                                    <path
                                        d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.6"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- CONFIRMAR SENHA -->

                    <div class="field">

                        <label for="confirmar-senha">
                            Confirmar senha
                        </label>

                        <div class="password-control">

                            <input
                                id="confirmar-senha"
                                name="confirmar_senha"
                                type="password"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                type="button"
                                class="password-toggle"
                                data-password-toggle="confirmar-senha"
                                aria-label="Mostrar senha"
                            >

                                <svg viewBox="0 0 24 24" fill="none">

                                    <path
                                        d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.6"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />

                                </svg>

                            </button>

                        </div>

                    </div>

                    <!-- BOTÕES -->

                    <div class="form-actions">

                        <a
                            href="login.html"
                            class="btn btn-outline"
                        >
                            Cancelar
                        </a>

                        <button
                            type="submit"
                            class="btn btn-primary"
                        >
                            Salvar
                        </button>

                    </div>

                    <!-- MENSAGEM DO FORMULÁRIO -->

                    <p
                        id="cadastro-status"
                        class="status"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></p>

                </form>

            </div>

        </section>

    </main>

    <script>

        // LOCALIZAR ELEMENTOS

        const formulario = document.querySelector('#cadastro-form');

        const senha = document.querySelector('#senha');

        const confirmarSenha = document.querySelector('#confirmar-senha');

        const statusCadastro = document.querySelector('#cadastro-status');


        // MOSTRAR MENSAGENS

        function mostrarStatus(mensagem, erro = false) {

            statusCadastro.textContent = mensagem;

            statusCadastro.hidden = false;

            statusCadastro.classList.toggle('error', erro);

        }


        // MOSTRAR OU ESCONDER SENHAS

        document.querySelectorAll('[data-password-toggle]')
            .forEach(function (botao) {

                botao.addEventListener('click', function () {

                    const campo = document.getElementById(
                        botao.dataset.passwordToggle
                    );

                    if (campo.type === 'password') {

                        campo.type = 'text';

                        botao.setAttribute(
                            'aria-label',
                            'Ocultar senha'
                        );

                    } else {

                        campo.type = 'password';

                        botao.setAttribute(
                            'aria-label',
                            'Mostrar senha'
                        );

                    }

                });

            });


        // VALIDAÇÃO DO FORMULÁRIO

        formulario.addEventListener('submit', function (evento) {

            evento.preventDefault();

            // Validar preenchimento dos campos

            if (!formulario.reportValidity()) {
                return;
            }

            // Conferir se as senhas são iguais

            if (senha.value !== confirmarSenha.value) {

                mostrarStatus(
                    'As senhas não são iguais. Confira e tente novamente.',
                    true
                );

                confirmarSenha.focus();

                return;
            }

            // Cadastro ainda não conectado à API

            mostrarStatus(
                'Formulário conferido! Ainda falta conectar o cadastro à API da Theka.'
            );

            // INTEGRAÇÃO FUTURA:
            // POST /users/
            //
            // Essa etapa será desenvolvida
            // junto com sua madrinha da EJECT.

        });

    </script>

</body>
</html>
