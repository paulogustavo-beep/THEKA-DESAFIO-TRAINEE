
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | Theka</title>
    <link rel="stylesheet" href="../styles/login.css">
</head>

<body>
    <main class="auth-layout auth-layout--cadastro">

        <section
            class="auth-brand auth-brand--espelhada"
            aria-label="Theka, biblioteca virtual"
        >
            <img
                class="auth-art"
                src="../assets/images/theka-ilustracao-acesso.svg"
                alt=""
            >

            <img
                class="auth-logo"
                src="../assets/images/theka-logo.svg"
                alt="Theka"
            >
        </section>

        <section
            class="auth-panel"
            aria-labelledby="titulo-pagina"
        >
            <div class="auth-content">

                <h1 class="auth-title" id="titulo-pagina">
                    Cadastro
                </h1>

                <form
                    class="auth-form"
                    data-formulario="cadastro"
                >
                    <div class="auth-field">
                        <label class="auth-label" for="nome">
                            Nome completo
                        </label>

                        <input
                            class="auth-input"
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Seu nome completo"
                            autocomplete="name"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="email">
                            E-mail
                        </label>

                        <input
                            class="auth-input"
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="auth-field">
                        <label class="auth-label" for="senha">
                            Senha
                        </label>

                        <div class="auth-password">
                            <input
                                class="auth-input"
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="auth-eye"
                                data-mostrar-senha="senha"
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5-3.5 5.5S2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linejoin="round"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.6"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="auth-field">
                        <label
                            class="auth-label"
                            for="confirmar-senha"
                        >
                            Confirmar senha
                        </label>

                        <div class="auth-password">
                            <input
                                class="auth-input"
                                type="password"
                                id="confirmar-senha"
                                name="confirmar-senha"
                                placeholder="••••••••"
                                autocomplete="new-password"
                                required
                            >

                            <button
                                type="button"
                                class="auth-eye"
                                data-mostrar-senha="confirmar-senha"
                                aria-label="Mostrar senha"
                                aria-pressed="false"
                            >
                                <svg
                                    viewBox="0 0 24 24"
                                    fill="none"
                                    aria-hidden="true"
                                >
                                    <path
                                        d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5-3.5 5.5S2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linejoin="round"
                                    />

                                    <circle
                                        cx="12"
                                        cy="12"
                                        r="2.6"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="auth-actions">
                        <a
                            class="auth-button auth-button--outline"
                            href="login.html"
                        >
                            Cancelar
                        </a>

                        <button
                            class="auth-button auth-button--primary"
                            type="submit"
                        >
                            Salvar
                        </button>
                    </div>

                    <p
                        id="mensagem-formulario"
                        class="auth-status"
                        role="status"
                        aria-live="polite"
                        hidden
                    ></p>
                </form>

            </div>
        </section>

    </main>

    <script src="../scripts/login.js"></script>
</body>
</html>
