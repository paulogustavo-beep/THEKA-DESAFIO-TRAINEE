        <!-- Formulário de login -->
        <section class="login-panel" aria-labelledby="login-title">
            <div class="login-content">
                <h1 id="login-title">Login</h1>

                <form id="login-form">
                    <div class="field">
                        <label for="email">E-mail</label>
                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="seuemail@email.com"
                            autocomplete="email"
                            required
                        >
                    </div>

                    <div class="field">
                        <label for="senha">Senha</label>

                        <div class="password-control">
                            <input
                                type="password"
                                id="senha"
                                name="senha"
                                placeholder="••••••••"
                                autocomplete="current-password"
                                required
                            >

                            <span class="password-eye" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none"
                                     xmlns="http://www.w3.org/2000/svg">
                                    <path
                                        d="M2.5 12s3.5-5.5 9.5-5.5 9.5 5.5 9.5 5.5-3.5 5.5-9.5 5.5S2.5 12 2.5 12Z"
                                        stroke="currentColor"
                                        stroke-width="1.7"
                                        stroke-linejoin="round"
                                    />
                                    <circle cx="12" cy="12" r="2.6"
                                            stroke="currentColor"
                                            stroke-width="1.7"/>
                                </svg>
                            </span>
                        </div>
                    </div>

                    <nav class="login-links" aria-label="Opções de acesso">
                        <a href="recuperar-senha.html">Esqueceu a senha?</a>
                        <a href="cadastro.html">Ainda não tem cadastro?</a>
                    </nav>

                    <div class="login-actions">
                        <button type="submit" class="login-button">
                            Entrar
                        </button>
                    </div>
                </form>
            </div>
        </section>
    </main>
