<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="referrer" content="no-referrer">
    <title>Definir nova senha | Theka</title>
    <link rel="stylesheet" href="../styles/login.css">
    <script src="../scripts/login.js" defer></script>
</head>
<body>
    <main class="auth-layout auth-layout--redefinicao">
        <section class="auth-brand" aria-label="Theka, biblioteca virtual">
            <svg class="auth-art auth-art--desktop" viewBox="0 0 1600 1080" preserveAspectRatio="xMinYMid meet" aria-hidden="true" focusable="false">
                <image href="../assets/images/auth-laco.svg" width="563" height="821" transform="matrix(-0.1717895 0.9851337 -0.9851337 -0.1717895 1062.5122 255.0392)" />
                <g transform="matrix(-0.9851337 -0.1717894 0.1717894 -0.9851337 241.8774 773.2109)">
                    <image href="../assets/images/auth-sapato.svg" x="-5.427" y="-9.999" width="329.981" height="414.029" />
                </g>
                <g transform="matrix(0.9851337 0.1717894 -0.1717894 0.9851337 956.3113 500.3326)">
                    <image href="../assets/images/auth-sapato.svg" x="-5.427" y="-9.999" width="329.981" height="414.029" />
                </g>
            </svg>

            <svg class="auth-art auth-art--mobile" viewBox="0 0 393 420" aria-hidden="true" focusable="false">
                <image href="../assets/images/auth-laco.svg" width="299.9801" height="437.4487" transform="matrix(-0.1717895 0.9851337 -0.9851337 -0.1717895 541.3643 115.1491)" />
                <g transform="matrix(-0.9851337 -0.1717894 0.1717894 -0.9851337 104.1102 391.2436)">
                    <g transform="scale(0.532824)">
                        <image href="../assets/images/auth-sapato.svg" x="-5.427" y="-9.999" width="329.981" height="414.029" />
                    </g>
                </g>
            </svg>

            <img class="auth-logo" src="../assets/images/auth-logo.svg" alt="Theka" width="245" height="68">
        </section>

        <section class="auth-panel" aria-labelledby="titulo-pagina">
            <h1 class="auth-title" id="titulo-pagina">Recuperar senha</h1>

            <form class="auth-form" data-formulario="redefinicao" method="post">
                <div class="auth-field">
                    <label class="auth-label" for="senha">Nova senha</label>
                    <input class="auth-input" id="senha" name="senha" type="password" placeholder="******" autocomplete="new-password" minlength="8" required>
                </div>

                <div class="auth-field">
                    <label class="auth-label" for="confirmar-senha">Confirmar nova senha</label>
                    <input class="auth-input" id="confirmar-senha" name="confirmar-senha" type="password" placeholder="******" autocomplete="new-password" required>
                </div>

                <div class="auth-actions">
                    <a class="auth-button auth-button--outline" href="recuperar-senha.html">Voltar</a>
                    <button class="auth-button" type="submit">Salvar</button>
                </div>

                <p class="auth-status" id="mensagem-formulario" role="status" aria-live="polite" hidden></p>
            </form>
        </section>
    </main>
</body>
</html>
